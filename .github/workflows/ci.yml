# Lint, type-check and test on every pull request and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # PySpark runs on the JVM; Spark 4.x needs Java 17+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pip install -e ".[dev,spark,feast]"

      - name: Ruff lint
        run: ruff check src tests feature_repo

      - name: Ruff format
        run: ruff format --check src tests feature_repo

      # Runs inside the installed environment (unlike the isolated pre-commit hook),
      # so third-party type stubs such as confluent-kafka's are checked too.
      - name: Mypy
        run: mypy src tests --ignore-missing-imports

      - name: Pytest
        run: pytest --cov=pipeline --cov-report=term-missing

      # Validates the Feast definitions and shows what `feast apply` would change.
      # Source validation needs a live Iceberg catalog, so it's skipped in CI; the
      # registry is created fresh, so this checks the definitions from scratch.
      - name: Feast plan
        env:
          REDIS_CONNECTION_STRING: localhost:6379
        run: feast -c feature_repo plan --skip-source-validation

  # Rejects Avro schema changes that existing data can't be read with. A separate job so it
  # runs in parallel with `checks` and doesn't need the Spark/Feast install.
  schema-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHEMA_REGISTRY_URL: http://localhost:8081
      # docker-compose.yml requires these to be set; the S3 services aren't started here.
      S3_ACCESS_KEY: unused
      S3_SECRET_KEY: unused
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need the base branch's schema files

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # Same Kafka + Schema Registry config as local development.
      - name: Start Schema Registry
        run: docker compose up -d --wait schema-registry

      # Proves the gate actually rejects breaking changes, so a pass below means something.
      - name: Integration tests
        run: pytest -m integration

      # PRs compare against their target branch; pushes to main against the previous commit.
      - name: Check schemas against base
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          status=0
          for schema in schemas/*.avsc; do
            git show "$BASE_REF:$schema" > "$RUNNER_TEMP/base.avsc" 2>/dev/null || : > "$RUNNER_TEMP/base.avsc"
            python -m pipeline.governance.schema_compat \
              --base "$RUNNER_TEMP/base.avsc" --candidate "$schema" || status=1
          done
          exit $status

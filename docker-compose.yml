# Local dev stack: Kafka (KRaft, no ZooKeeper) + Schema Registry + Redis + web console.
# Start:  docker compose up -d      Check: docker compose ps      Stop: docker compose down -v
name: rtfp

x-healthcheck-defaults: &hc
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"   # host clients (producer.py, local PySpark)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL = other containers, EXTERNAL = your laptop
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly below
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]

  # One-shot job: creates topics, then exits
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in market.trades.raw market.trades.dlq market.features.1m; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$t" --partitions 6 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects > /dev/null"]

  redis:
    image: redis:7.4-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "ping"]

  # Web UI for topics, messages and schemas: http://localhost:8080
  console:
    image: redpandadata/console:v2.7.2
    container_name: console
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://schema-registry:8081

  # S3-compatible object storage for the Iceberg offline store (MinIO's free images were
  # discontinued). S3 API: http://localhost:8333. Credentials come from .env.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: seaweedfs
    # -ip: address advertised to other services; -ip.bind: listen on all interfaces
    command: ["server", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0",
              "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=256"]
    ports:
      - "8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:9333/cluster/status"]

  # One-shot job: creates the "warehouse" bucket if it doesn't exist, then exits
  s3-init:
    image: chrislusf/seaweedfs:4.48
    container_name: s3-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -qw warehouse; then
          echo "bucket warehouse already exists"
        else
          echo "s3.bucket.create -name warehouse" | weed shell -master=seaweedfs:9333
        fi
    restart: "no"

  # Iceberg REST catalog: tracks where each table's current metadata lives.
  # Apache's reference implementation, fine for local dev; production would use
  # Polaris, Glue, Lakekeeper or similar. Catalog state persists in the volume.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: iceberg-rest
    depends_on:
      s3-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      CATALOG_URI: jdbc:sqlite:/home/iceberg/iceberg_catalog.db
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      # Mounted over the image user's home so the volume is owned by that user (uid 1000).
      - iceberg-catalog:/home/iceberg

  # Spark runtime (Linux + Java 17). Not started by `docker compose up`; used on demand:
  #   docker compose run --rm spark pytest
  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: rtfp-spark:local
    profiles: ["spark"]
    volumes:
      - .:/app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081

  # Streaming job: market.trades.raw -> windowed features -> market.features.1m
  #   docker compose up -d streaming-job      logs: docker compose logs -f streaming-job
  # Spark UI (micro-batches, state, watermark): http://localhost:4040
  streaming-job:
    image: rtfp-spark:local
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    profiles: ["streaming"]
    command: ["python", "-m", "pipeline.streaming.job"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "4040:4040"
    volumes:
      - .:/app
      # Checkpoint (Kafka offsets + window state) survives container restarts.
      - spark-checkpoints:/checkpoints
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: unless-stopped

volumes:
  kafka-data:
  redis-data:
  spark-checkpoints:
  seaweedfs-data:
  iceberg-catalog:

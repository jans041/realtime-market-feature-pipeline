[project]
name = "realtime-market-feature-pipeline"
version = "0.1.0"
description = "Real-time market event and feature pipeline: Kafka, PySpark Structured Streaming, Feast, Iceberg"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.6",
    "websockets>=13.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.13", "pre-commit>=4.0"]
# Streaming job and its tests. Large (~400 MB) and needs Java 17+, so kept out of the base install.
spark = ["pyspark~=4.2.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

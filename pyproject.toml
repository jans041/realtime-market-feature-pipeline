[project]
name = "realtime-market-feature-pipeline"
version = "0.1.0"
description = "Real-time market event and feature pipeline: Kafka, PySpark Structured Streaming, Feast, Iceberg"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.6",
    "websockets>=13.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.13", "pre-commit>=4.0",
       # Local SQLite-backed Iceberg catalog for tests that write real tables.
       "pyiceberg[sql-sqlite]>=0.9"]
# Streaming job and its tests. Large (~400 MB) and needs Java 17+, so kept out of the base install.
spark = ["pyspark~=4.2.0"]
# Feature store: Redis online store, DuckDB offline engine, Iceberg tables via pyiceberg.
feast = ["feast[redis,duckdb,iceberg]~=0.66.0", "pyiceberg[pyarrow,s3fs,pyiceberg-core]>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.pep8-naming]
# `from pyspark.sql import functions as F` is the standard PySpark idiom.
ignore-names = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Integration tests need live services (docker compose); run them with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = ["integration: needs services from docker compose (e.g. Schema Registry)"]
